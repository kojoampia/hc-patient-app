<hpm-portal-page titleKey="patientPortal.nav.activity">
  <div class="hc-tools">
    <hpm-search-box
      inputId="q_activity"
      placeholderKey="patientPortal.activity.search"
      [value]="query()"
      (queryChange)="query.set($event)"
    />
  </div>

  <!-- Scrolls horizontally rather than wrapping: seven chips wrapped at 390px push the timeline off screen. -->
  <div class="hpm-activity__kinds">
    @for (option of kinds; track option) {
      <button type="button" class="hc-toggle" [class.is-on]="kind() === option" (click)="setKind(option)">
        {{ option | hpmStatus }}
      </button>
    }
  </div>

  <hpm-stream
    class="hc-mt-16"
    [resource]="activity()"
    emptyTitleKey="patientPortal.activity.empty"
    emptyMessageKey="patientPortal.activity.emptyHint"
    emptyIcon="document-text-outline"
    [skeletonRowHeight]="72"
  >
    <div class="hc-card hc-card-pad">
      @for (item of filtered(); track item.id) {
        <div class="hc-tl-item">
          <span class="hc-tl-item__dot" [style.background]="style(item.kind).colour">
            <hpm-icon [name]="style(item.kind).icon" [size]="14" [strokeWidth]="2.4" />
          </span>

          <div class="hc-grow">
            <div class="hc-row hc-between hc-gap-8 hc-wrap">
              <b class="hc-sm">{{ item.summary }}</b>
              <span class="hc-muted hc-tiny hc-num">{{ formatInstantDay(item.loggedAt, item.createdDate) }}</span>
            </div>

            @if (item.detail) {
              <p class="hc-muted hc-sm hpm-activity__detail">{{ item.detail }}</p>
            }

            <div class="hc-muted hc-tiny hpm-activity__author">
              <!-- source decides before authorId: an entry the patient wrote is "You", not a clinician. -->
              {{ authorName(item) }}
              @if (caseLabel(item.caseId); as label) {
                · <a (click)="openCase(item.caseId)">{{ label }}</a>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </hpm-stream>
</hpm-portal-page>
